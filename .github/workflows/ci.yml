name: CI - Frozen Ice

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frozen-ice-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frozen-ice-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify build
        run: test -d dist

  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frozen-ice-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: frozen-ice-backend/pom.xml

      - name: Build and test
        run: mvn -B -ntp clean verify

      - name: Verify artifact
        run: test -n "$(find target -maxdepth 1 -name '*.jar' -print -quit)"
      
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: frozen-ice-backend/target/surefire-reports/
          if-no-files-found: warn

  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend
    if: always()
    timeout-minutes: 2

    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.frontend.result }}" != "success" ]]; then
            echo "Frontend CI failed."
            exit 1
          fi

          if [[ "${{ needs.backend.result }}" != "success" ]]; then
            echo "Backend CI failed."
            exit 1
          fi

          echo "Frozen Ice CI passed successfully!"